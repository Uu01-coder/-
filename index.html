<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포인트 조회</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 200px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>포인트 조회</h1>

  <input id="name" placeholder="이름을 입력하세요">
  <button onclick="check()">조회</button>

  <p id="result"></p>

  <script>
    const SUPABASE_URL =
      "https://fcuytweopgfrnyspizib.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Fnc9qrlqwCAQ5OTyFxhxFA_qe7Y_HrZ";

    async function check() {
      const name = document.getElementById("name").value.trim();
      const result = document.getElementById("result");

      if (!name) {
        result.textContent = "이름을 입력해주세요.";
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/Point?name=eq.${encodeURIComponent(name)}&select=name,points`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        const data = await response.json();

        if (data.length === 0) {
          result.textContent = "등록된 이름이 없습니다.";
        } else {
          result.textContent =
            `${data[0].name}님의 포인트 수는 ${data[0].points}P입니다.`;
        }

      } catch (error) {
  console.error(error);
  result.textContent = "오류: " + String(error);
}
    }
  </script>

</body>
</html>
